function renderSemanticTable() {
  const allWords = Object.entries(state.semanticLibrary);
  dom.semanticTableBody.innerHTML = allWords.map(([word, def]) => `
    <tr>
      <td><span class="word-tag">${escapeHtml(word)}</span></td>
      <td>${def.type}</td>
      <td>${def.useCount || 0}</td>
      <td>
        <button class="btn btn-xs btn-outline sem-edit-btn" data-word="${escapeHtml(word)}">✏️</button>
        <button class="btn btn-xs btn-outline sem-del-btn" data-word="${escapeHtml(word)}" style="color:var(--accent);">🗑️</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:20px;">暂无自定义词条<br>内置词汇可直接使用</td></tr>';

  dom.semanticStatus.textContent = `共 ${allWords.length} 个自定义词条 | 内置 ${Object.keys(BUILTIN_WORDS).length} 个词汇`;
}

// Handler for semantic table buttons
dom.semanticTableBody.addEventListener('click', (e) => {
  const word = e.target.dataset.word;
  if (!word) return;
  if (e.target.classList.contains('sem-del-btn')) {
    if (confirm(`删除词条 "${word}"？`)) {
      removeWordFromLibrary(word);
      renderSemanticTable();
      showToast('🗑️ 词条已删除');
    }
  }
  if (e.target.classList.contains('sem-edit-btn')) {
    const def = state.semanticLibrary[word];
    if (!def) return;
    dom.newWordText.value = word;
    dom.newWordType.value = def.type;
    dom.newWordDuration.value = def.duration;
    dom.newWordSpeed.value = def.speed;
    dom.newWordSpeedVal.textContent = def.speed.toFixed(1) + 'x';
    dom.newWordShake.value = def.shake;
    dom.newWordDof.value = def.dof;
    dom.newWordDofVal.textContent = def.dof;
    dom.newWordExtra.value = JSON.stringify(def.extra || {}, null, 2);
    dom.newWordPrompt.textContent = `编辑词条 "${word}"`;
    dom.newWordOverlay.style.display = 'flex';
  }
});

// Parse shot button - 智能NL解析，输入即所得
$('#btn-parse-shot').addEventListener('click', () => {
  if (!state.modelLoaded) { showToast('⚠️ 请先加载模型'); return; }
  const text = dom.shotInput.value.trim();
  if (!text) { showToast('⚠️ 请输入镜头描述'); return; }

  // 智能解析：自动理解自然语言，无需手动选择镜头类型
  const newShots = parseShots(text);

  if (newShots.length === 0) {
    showToast('⚠️ 未能解析镜头描述，请尝试更明确的描述');
    return;
  }

  // 添加镜头到时间轴
  state.shots.push(...newShots);

  // 自动匹配词库并增加使用计数
  const allWords = { ...state.semanticLibrary };
  newShots.forEach(s => {
    for (const word of Object.keys(allWords)) {
      if (s.text.includes(word)) {
        incrementWordUse(word);
        break;
      }
    }
  });

  updateShotList();
  drawTimeline();
  showToast(`✅ 已理解：${newShots.length}段镜头已生成`);
});

// New word dialog - sequential prompting
function promptNewWord(desc, index) {
  if (index >= state.pendingUnknownWords.length) {
    state.pendingUnknownWords = [];
    return;
  }
  const word = state.pendingUnknownWords[index];
  dom.newWordPrompt.textContent = `「${word}」不在语义库中，请绑定运动类型和参数：`;
  dom.newWordText.value = word;
  dom.newWordType.value = 'orbit';
  dom.newWordDuration.value = '3';
  dom.newWordSpeed.value = '1';
  dom.newWordSpeedVal.textContent = '1.0x';
  dom.newWordShake.value = '0';
  dom.newWordDof.value = '0';
  dom.newWordDofVal.textContent = '0';
  dom.newWordExtra.value = '';
  dom.newWordOverlay.style.display = 'flex';
  dom.newWordOverlay._pendingIndex = index;
}

$('#btn-save-word').addEventListener('click', () => {
  const word = dom.newWordText.value.trim();
  if (!word) { showToast('⚠️ 请输入词汇'); return; }
  let extra = {};
  try { if (dom.newWordExtra.value.trim()) extra = JSON.parse(dom.newWordExtra.value); } catch(e) { showToast('⚠️ 高级参数JSON格式错误'); return; }
  addWordToLibrary(word, {
    type: dom.newWordType.value,
    duration: parseFloat(dom.newWordDuration.value),
    speed: parseFloat(dom.newWordSpeed.value),
    shake: parseInt(dom.newWordShake.value),
    dof: parseFloat(dom.newWordDof.value),
    extra,
    useCount: (state.semanticLibrary[word]?.useCount || 0) + 1,
  });
  dom.newWordOverlay.style.display = 'none';
  showToast(`✅ 已学习新词: ${word}`);
  renderSemanticTable();

  // 根据调用来源决定后续行为
  if (state._addWordStandalone) {
    // 来自语义库管理面板的「添加词条」- 直接关闭
    state._addWordStandalone = false;
  } else {
    // 来自解析镜头的未知词汇弹窗 - 继续提示下一个未知词
    const idx = (dom.newWordOverlay._pendingIndex || 0) + 1;
    if (idx < state.pendingUnknownWords.length) {
      promptNewWord(state.pendingUnknownWords[idx], idx);
    } else {
      state.pendingUnknownWords = [];
    }
  }
});

$('#btn-cancel-word').addEventListener('click', () => {
  dom.newWordOverlay.style.display = 'none';
  if (state._addWordStandalone) {
    // 来自语义库管理面板 - 直接关闭
    state._addWordStandalone = false;
  } else {
    // 来自解析镜头 - 跳过当前未知词，继续下一个
    const idx = (dom.newWordOverlay._pendingIndex || 0) + 1;
    if (idx < state.pendingUnknownWords.length) {
      promptNewWord(state.pendingUnknownWords[idx], idx);
    } else {
      state.pendingUnknownWords = [];
    }
  }
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlayPause(); break;
    case 'ArrowLeft': e.preventDefault(); stepFrame(-1); break;
    case 'ArrowRight': e.preventDefault(); stepFrame(1); break;
    case 'Delete': if (state.selectedShotId) deleteShot(state.selectedShotId); break;
    case 'd': if (e.ctrlKey && state.selectedShotId) { e.preventDefault(); duplicateShot(state.selectedShotId); } break;
    case 's': if (e.ctrlKey && state.selectedShotId) { e.preventDefault(); splitShot(state.selectedShotId); } break;
  }
});

    state.pixelsPerSecond = Math.max(25, Math.min(400, state.pixelsPerSecond));
    drawTimeline();
  }
});

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  // Load semantic library from localStorage
  loadSemanticLibrary();

  // Setup renderer size
  resizeRenderer();

  // Draw initial timeline
  drawTimeline();

  // Update initial display
  updateShotList();
  updatePlaybackTime();
  dom.totalTimeDisplay.textContent = '0.00s';

  // Start render loop
  requestAnimationFrame(animate);

  // Handle window resize => redraw timeline
  window.addEventListener('resize', () => {
    resizeRenderer();
    drawTimeline();
  });

  // Observe timeline container for size changes
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { drawTimeline(); });
    ro.observe(dom.timelineCanvasWrap);
  }

  console.log('🎬 3D运镜工作室已就绪');
  console.log('  - 内置词汇:', Object.keys(BUILTIN_WORDS).length, '个');
  console.log('  - 自定义词条:', Object.keys(state.semanticLibrary).length, '个');
  console.log('  - Three.js + Draco + 语义学习 + 时间轴剪辑');
  console.log('  - 纯前端运行，无后端依赖');
  console.log('  - CDN: jsdelivr (国内可访问)');
}

init();
